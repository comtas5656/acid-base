<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>酸塩基暗記倶楽部</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --success-color: #27ae60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary-color);
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .nav-btn.active {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .question-box {
      font-size: 1.3rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      padding: 15px;
      background-color: #edf2f7;
      border-radius: 8px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (min-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      padding: 12px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 1rem;
      transition: background-color 0.2s;
    }

    .option-btn:hover {
      background-color: #f1f5f9;
    }

    .comment-box {
      margin-top: 15px;
      padding: 15px;
      background-color: #f0fdf4;
      border-left: 4px solid var(--success-color);
      border-radius: 4px;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      margin-top: 15px;
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    .list-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .list-table th, .list-table td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: left;
    }

    .list-table th {
      background-color: #edf2f7;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>酸塩基暗記倶楽部</h1>
    <nav>
      <button class="nav-btn active" onclick="switchMode(1)">モード1: 酸・塩基</button>
      <button class="nav-btn" onclick="switchMode(2)">モード2: 塩の分類</button>
      <button class="nav-btn" onclick="switchMode(3)">モード3: 酸化物</button>
      <button class="nav-btn" onclick="toggleList()">一覧表示</button>
    </nav>
  </header>

  <main>
    <!-- クイズカード -->
    <div id="quiz-view" class="card">
      <div id="question" class="question-box">問題読み込み中...</div>
      <div id="options" class="options-grid"></div>
      <div id="comment" class="comment-box hidden"></div>
      <button id="next-btn" class="action-btn hidden" onclick="nextQuestion()">次の問題へ</button>
    </div>

    <!-- 一覧表示ビュー -->
    <div id="list-view" class="card hidden">
      <h2 id="list-title">データ一覧</h2>
      <div style="overflow-x: auto;">
        <table class="list-table">
          <thead>
            <tr id="table-head"></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // --- データ定義 ---

    // モード1: 酸・塩基
    const mode1Data = [
      { id: 1, name: "塩酸", formula: "HCl", type: "強酸", volatility: "揮発性", comment: "強酸・1価。揮発性。" },
      { id: 2, name: "硝酸", formula: "HNO₃", type: "強酸", volatility: "揮発性", comment: "強酸・1価。揮発性。" },
      { id: 3, name: "硫酸", formula: "H₂SO₄", type: "強酸", volatility: "不揮発性", comment: "強酸・2価。不揮発性。" },
      { id: 4, name: "酢酸", formula: "CH₃COOH", type: "弱酸", volatility: "揮発性", comment: "弱酸・1価。揮発性。" },
      { id: 5, name: "水酸化ナトリウム", formula: "NaOH", type: "強塩基", volatility: "-", comment: "強塩基・1価。" },
      { id: 6, name: "水酸化カルシウム", formula: "Ca(OH)₂", type: "強塩基", volatility: "-", comment: "強塩基・2価。" },
      { id: 7, name: "アンモニア", formula: "NH₃", type: "弱塩基", volatility: "揮発性", comment: "弱塩基・1価。揮発性。" }
    ];

    // モード2: 塩の分類・性質
    const mode2Data = [
      { id: 101, name: "塩化ナトリウム", formula: "NaCl", category: "正塩", acidity: "中性", parent: "強酸 + 強塩基", comment: "HCl + NaOH からなる正塩。水溶液は中性。" },
      { id: 102, name: "炭酸水素ナトリウム", formula: "NaHCO₃", category: "酸性塩", acidity: "弱塩基性", parent: "弱酸 + 強塩基", comment: "H₂CO₃ + NaOH からなる酸性塩。水溶液は弱塩基性。" },
      { id: 103, name: "硫酸水素ナトリウム", formula: "NaHSO₄", category: "酸性塩", acidity: "酸性", parent: "強酸 + 強塩基", comment: "H₂SO₄ + NaOH からなる酸性塩。水溶液は強酸由来のため酸性。" },
      { id: 104, name: "塩化アンモニウム", formula: "NH₄Cl", category: "正塩", acidity: "酸性", parent: "強酸 + 弱塩基", comment: "HCl + NH₃ からなる正塩。水溶液は酸性。" },
      { id: 105, name: "酢酸ナトリウム", formula: "CH₃COONa", category: "正塩", acidity: "弱塩基性", parent: "弱酸 + 強塩基", comment: "CH₃COOH + NaOH からなる正塩。水溶液は弱塩基性。" }
    ];

    // モード3: 酸化物
    const mode3Data = [
      {
        id: 201,
        name: "二酸化炭素",
        formula: "CO₂",
        category: "酸性酸化物",
        waterReaction: "CO₂ + H₂O ⇄ H₂CO₃",
        acidBaseReaction: "CO₂ + Ca(OH)₂ → CaCO₃ + H₂O\nCO₂ + CaO → CaCO₃",
        comments: {
          basic: "非金属（C）の酸化物。",
          category: "酸性酸化物（水に溶けて酸を生じる、または塩基と反応して塩を作る）。",
          water: "CO₂ + H₂O ⇄ H₂CO₃",
          acidBase: "H₂CO₃（炭酸）と同様の働きをする。"
        }
      },
      {
        id: 202,
        name: "二酸化硫黄",
        formula: "SO₂",
        category: "酸性酸化物",
        waterReaction: "SO₂ + H₂O ⇄ H₂SO₃",
        acidBaseReaction: "SO₂ + 2NaOH → Na₂SO₃ + H₂O\nSO₂ + Na₂O → Na₂SO₃",
        comments: {
          basic: "非金属（S）の酸化物。",
          category: "酸性酸化物。",
          water: "SO₂ + H₂O ⇄ H₂SO₃",
          acidBase: "H₂SO₃（亜硫酸）と同様の働きをする。"
        }
      },
      {
        id: 203,
        name: "三酸化硫黄",
        formula: "SO₃",
        category: "酸性酸化物",
        waterReaction: "SO₃ + H₂O → H₂SO₄",
        acidBaseReaction: "SO₃ + 2NaOH → Na₂SO₄ + H₂O",
        comments: {
          basic: "非金属（S）の酸化物。",
          category: "酸性酸化物。",
          water: "SO₃ + H₂O → H₂SO₄",
          acidBase: "H₂SO₄（硫酸）と同様の働きをする。"
        }
      },
      {
        id: 204,
        name: "二酸化ケイ素",
        formula: "SiO₂",
        category: "酸性酸化物",
        waterReaction: "反応しない（不溶）",
        acidBaseReaction: "SiO₂ + 2NaOH → Na₂SiO₃ + H₂O（加熱融解）\nSiO₂ + Na₂CO₃ → Na₂SiO₃ + CO₂",
        comments: {
          basic: "石英・ケイ砂の主成分（共有結合結晶）。",
          category: "酸性酸化物（水とは反応しないが塩基と反応する）。",
          water: "反応しない（不溶）。",
          acidBase: "H₂SiO₃（ケイ酸）と同様の働きをする。"
        }
      },
      {
        id: 205,
        name: "二酸化窒素",
        formula: "NO₂",
        category: "酸性酸化物",
        waterReaction: "3NO₂ + H₂O → 2HNO₃ + NO（温水）",
        acidBaseReaction: "2NO₂ + 2NaOH → NaNO₂ + NaNO₃ + H₂O",
        comments: {
          basic: "赤褐色の気体。非金属（N）の酸化物。",
          category: "酸性酸化物。",
          water: "3NO₂ + H₂O → 2HNO₃ + NO（自己酸化還元反応）",
          acidBase: "HNO₂（亜硝酸）および HNO₃（硝酸）と同様の働きをし、亜硝酸塩と硝酸塩を生じる。"
        }
      },
      {
        id: 206,
        name: "酸化カルシウム",
        formula: "CaO",
        category: "塩基性酸化物",
        waterReaction: "CaO + H₂O → Ca(OH)₂",
        acidBaseReaction: "CaO + 2HCl → CaCl₂ + H₂O\nCaO + CO₂ → CaCO₃",
        comments: {
          basic: "生石灰。金属（Ca）の酸化物。",
          category: "塩基性酸化物（水と反応して塩基を生じる、または酸と反応して塩を作る）。",
          water: "CaO + H₂O → Ca(OH)₂（発熱反応）",
          acidBase: "Ca(OH)₂（水酸化カルシウム）と同様の働きをする。"
        }
      },
      {
        id: 207,
        name: "酸化ナトリウム",
        formula: "Na₂O",
        category: "塩基性酸化物",
        waterReaction: "Na₂O + H₂O → 2NaOH",
        acidBaseReaction: "Na₂O + H₂SO₄ → Na₂SO₄ + H₂O\nNa₂O + SO₂ → Na₂SO₃",
        comments: {
          basic: "金属（Na）の酸化物。",
          category: "塩基性酸化物。",
          water: "Na₂O + H₂O → 2NaOH",
          acidBase: "NaOH（水酸化ナトリウム）と同様の働きをする。"
        }
      },
      {
        id: 208,
        name: "酸化アルミニウム",
        formula: "Al₂O₃",
        category: "両性酸化物",
        waterReaction: "反応しない（不溶）",
        acidBaseReaction: "対 酸: Al₂O₃ + 6HCl → 2AlCl₃ + 3H₂O\n対 塩基: Al₂O₃ + 2NaOH + 3H₂O → 2Na[Al(OH)₄]",
        comments: {
          basic: "アルミナ。両性元素（Al）の酸化物。",
          category: "両性酸化物（酸とも強塩基とも反応する）。",
          water: "反応しない（不溶）。",
          acidBase: "酸に対しては塩基として、強塩基に対しては酸として働く。"
        }
      }
    ];

    // --- 状態管理 ---
    let currentMode = 1;
    let currentQuestion = null;
    let isListView = false;

    // --- モード切り替え ---
    function switchMode(mode) {
      currentMode = mode;
      isListView = false;
      
      document.querySelectorAll('.nav-btn').forEach((btn, index) => {
        if (index === mode - 1) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      document.getElementById('quiz-view').classList.remove('hidden');
      document.getElementById('list-view').classList.add('hidden');

      nextQuestion();
    }

    // --- 一覧表示切り替え ---
    function toggleList() {
      isListView = !isListView;
      const quizView = document.getElementById('quiz-view');
      const listView = document.getElementById('list-view');

      if (isListView) {
        quizView.classList.add('hidden');
        listView.classList.remove('hidden');
        renderList();
      } else {
        quizView.classList.remove('hidden');
        listView.classList.add('hidden');
      }
    }

    // --- クイズ生成ロジック ---
    function nextQuestion() {
      document.getElementById('comment').classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');

      let dataset = mode1Data;
      if (currentMode === 2) dataset = mode2Data;
      if (currentMode === 3) dataset = mode3Data;

      const item = dataset[Math.floor(Math.random() * dataset.length)];
      currentQuestion = item;

      const qBox = document.getElementById('question');
      const optBox = document.getElementById('options');
      optBox.innerHTML = '';

      if (currentMode === 1) {
        qBox.textContent = `【${item.name} (${item.formula})】の分類は？`;
        const options = ["強酸", "弱酸", "強塩基", "弱塩基"];
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => checkAnswer(opt === item.type, item.comment);
          optBox.appendChild(btn);
        });
      } else if (currentMode === 2) {
        qBox.textContent = `【${item.name} (${item.formula})】の水溶液の液性は？`;
        const options = ["酸性", "中性", "弱塩基性", "強塩基性"];
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => checkAnswer(opt === item.acidity, item.comment);
          optBox.appendChild(btn);
        });
      } else if (currentMode === 3) {
        qBox.textContent = `【${item.name} (${item.formula})】の分類は？`;
        const options = ["酸性酸化物", "塩基性酸化物", "両性酸化物"];
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => {
            const commentText = `【分類】${item.category}\n【水との反応】${item.waterReaction}\n【酸・塩基との反応】\n${item.acidBaseReaction}\n\n💡解説:\n${item.comments.basic}\n${item.comments.category}\n${item.comments.acidBase}`;
            checkAnswer(opt === item.category, commentText);
          };
          optBox.appendChild(btn);
        });
      }
    }

    function checkAnswer(isCorrect, commentText) {
      const commentBox = document.getElementById('comment');
      const nextBtn = document.getElementById('next-btn');

      commentBox.textContent = (isCorrect ? "⭕ 正解！\n\n" : "❌ 不正解...\n\n") + commentText;
      commentBox.classList.remove('hidden');
      nextBtn.classList.remove('hidden');
    }

    // --- 一覧テーブル描画 ---
    function renderList() {
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      thead.innerHTML = '';
      tbody.innerHTML = '';

      if (currentMode === 1) {
        document.getElementById('list-title').textContent = "モード1: 酸・塩基 一覧";
        thead.innerHTML = `<th>名称</th><th>化学式</th><th>分類</th><th>揮発性</th><th>解説</th>`;
        mode1Data.forEach(d => {
          tbody.innerHTML += `<tr><td>${d.name}</td><td>${d.formula}</td><td>${d.type}</td><td>${d.volatility}</td><td>${d.comment}</td></tr>`;
        });
      } else if (currentMode === 2) {
        document.getElementById('list-title').textContent = "モード2: 塩の分類・性質 一覧";
        thead.innerHTML = `<th>名称</th><th>化学式</th><th>塩の分類</th><th>液性</th><th>元の酸・塩基</th>`;
        mode2Data.forEach(d => {
          tbody.innerHTML += `<tr><td>${d.name}</td><td>${d.formula}</td><td>${d.category}</td><td>${d.acidity}</td><td>${d.parent}</td></tr>`;
        });
      } else if (currentMode === 3) {
        document.getElementById('list-title').textContent = "モード3: 酸化物 一覧";
        thead.innerHTML = `<th>名称</th><th>化学式</th><th>分類</th><th>水との反応</th><th>酸・塩基との反応</th>`;
        mode3Data.forEach(d => {
          const acidBaseFormatted = d.acidBaseReaction.replace(/\n/g, '<br>');
          tbody.innerHTML += `<tr><td>${d.name}</td><td>${d.formula}</td><td>${d.category}</td><td>${d.waterReaction}</td><td>${acidBaseFormatted}</td></tr>`;
        });
      }
    }

    // 初期化
    switchMode(1);
  </script>
</body>
</html>
